name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Install Capacitor & generate Android project
        run: |
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.js
          /** @type {import('@capacitor/cli').CapacitorConfig} */
          const config = {
            appId: 'com.joeell123123.motorparts',
            appName: 'MotorParts',
            webDir: 'dist',
            server: {
              androidScheme: 'https'
            }
          };

          module.exports = config;
          EOF
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android --config capacitor.config.js
          npx cap sync android --config capacitor.config.js

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotorParts-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
