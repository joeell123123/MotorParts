name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Install Capacitor & generate Android project
        run: |
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.cjs
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.joeell123123.motorparts",
            "appName": "MotorParts",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                      because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                      because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
                  }
              }
          }
          EOF
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotorParts-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
